[project]
name = "verihire-api"
version = "0.1.0"
description = "VeriHire API — trust score engine, auth, entities, reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "pgvector>=0.3.6",
    "aiosmtplib>=5.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.1",
    "pre-commit>=4.0.0",
    "types-redis>=4.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
