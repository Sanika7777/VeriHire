services:
  - name: verihire-api
    type: web
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    preDeployCommand: uv run alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      # Set these two after the web app is deployed on Vercel — see
      # docs/deploy.md. Using a placeholder first is fine; the API just
      # won't accept cross-origin requests from the real frontend until
      # these are updated and the service is redeployed.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: ML_ARTIFACTS_DIR
        value: ../../services/ml/artifacts
      # Optional — leave unset to run without them (everything degrades
      # gracefully per docs/limitations.md). Fill in via the Render
      # dashboard, not here, since real values shouldn't live in a file.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false

  - name: verihire-worker
    type: worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: uv run arq app.workers.worker.WorkerSettings
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_ARTIFACTS_DIR
        value: ../../services/ml/artifacts
      - key: SENTRY_DSN
        sync: false
