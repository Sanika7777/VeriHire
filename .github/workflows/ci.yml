name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verihire
          POSTGRES_PASSWORD: verihire
          POSTGRES_DB: verihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verihire -d verihire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://verihire:verihire@localhost:5432/verihire
      TEST_DATABASE_URL: postgresql+asyncpg://verihire:verihire@localhost:5432/verihire
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.2"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --all-extras

      - name: Enable pg_trgm extension
        run: |
          PGPASSWORD=verihire psql -h localhost -U verihire -d verihire \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Mypy
        working-directory: apps/api
        run: uv run mypy app

      - name: Run migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Pytest
        working-directory: apps/api
        run: uv run pytest --cov=app --cov-report=term-missing

  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter @verihire/web lint

      - name: Typecheck
        run: pnpm --filter @verihire/web typecheck

      - name: Test
        run: pnpm --filter @verihire/web test

      - name: Build
        run: pnpm --filter @verihire/web build
